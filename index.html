<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sporefall</title>
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="rust" href="crates/web_app/Cargo.toml" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Sporefall Prototype</p>
        <h1>Sort falling mushrooms into the right buckets.</h1>
        <p class="lede">
          This first slice wires the Rust game core into a browser canvas so the
          gameplay rules can evolve behind a stable shell.
        </p>
      </header>
      <section class="playfield-card">
        <div class="hud">
          <div class="hud-panel">
            <span class="hud-label">Score</span>
            <strong id="score-value">0</strong>
          </div>
          <div class="hud-panel">
            <span class="hud-label">Feedback</span>
            <strong id="feedback-value">Drop a mushroom into the matching lane.</strong>
          </div>
        </div>
        <canvas id="game-canvas" width="960" height="540"></canvas>
      </section>
    </main>
  </body>
</html>
